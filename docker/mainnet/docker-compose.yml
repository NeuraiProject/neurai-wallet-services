name: neurai-wallet-services-mainnet

# Deployment-specific values (secrets, ports, public URL, trusted proxies,
# quotas, token) come from a `.env` file next to this compose file — copy
# `.env.example` to `.env` and edit it there; it is ignored by git, so it
# survives updates to this file. Every `${VAR:-default}` below has the same
# default in .env.example, so the stack also starts without a .env.

services:
  neuraid:
    # Official prebuilt mainnet node image from Docker Hub:
    # https://hub.docker.com/r/neuraiproject/neurai-node/tags
    # No local build needed — pull the pinned tag instead of compiling from
    # source. The official image is mainnet-only; testnet keeps building from
    # ../node because the official image does not support a testnet switch.
    image: "neuraiproject/neurai-node:${NODE_IMAGE_TAG:-v1.0.6}"
    restart: unless-stopped
    # The official entrypoint lets neuraid flush its databases on shutdown.
    # Avoid Docker's default 10-second timeout, which can cause a long reindex
    # after an unclean stop.
    stop_grace_period: 5m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # v1.0.6 stores its datadir and configuration directly in /data. Its
    # entrypoint only generates /data/neurai.conf when absent, without our ZMQ
    # settings. Mount the repository's config read-only so rpc-proxy keeps its
    # ZMQ endpoint (tcp://neuraid:28332), plus the required RPC/index settings.
    # Edit ./neurai.conf to change them.
    volumes:
      - neurai_data_mainnet:/data
      - ./neurai.conf:/data/neurai.conf:ro

    # Internal-only — the node is not reachable from the host. The rpc-proxy
    # container talks to neuraid:19001 (RPC) and neuraid:28332 (ZMQ) over the
    # neurai_net_mainnet bridge. Use `docker compose exec neuraid neurai-cli ...`
    # for CLI access.
    networks:
      - neurai_net_mainnet

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 10s
      retries: 3
      # A first start may need time to initialize the chain state.
      start_period: 10m

    # Matches the official v1.0.6 deployment recommendation for an indexer.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  rpc-proxy:
    build:
      # Image is built by cloning neurai-wallet-services from GitHub, so the
      # build context only needs the rpc-proxy/ folder (entrypoint.sh).
      context: ../rpc-proxy
      dockerfile: Dockerfile
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      NEURAI_NODE_NAME: "neuraid-mainnet"
      # Must match rpcuser / rpcpassword / rpcport in ./neurai.conf: the
      # official image reads that file, not these variables.
      NEURAI_NODE_URL: "http://neuraid:${NODE_RPC_PORT:-19001}"
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"
      # DePIN protocol 2 is relayed through NEURAI_NODE_URL when the node
      # serves it; the official v1.0.6 image does not, so depin* calls are
      # answered by the node with an error. Quota for depin* per IP (HTTP+WSS).
      PROXY_DEPIN_RATE_LIMIT: "${PROXY_DEPIN_RATE_LIMIT:-60}"
      PROXY_DEPIN_BAN_MINUTES: "${PROXY_DEPIN_BAN_MINUTES:-10}"
      # Reverse proxies whose X-Forwarded-For is believed (HTTP and WSS). When
      # using Hestia/nginx on the host, add this Compose network's bridge
      # gateway (inspect it with `docker network inspect neurai_net_mainnet`).
      # The reverse proxy must OVERWRITE the header ($remote_addr), never
      # append to it ($proxy_add_x_forwarded_for).
      PROXY_TRUSTED_PROXIES: "${PROXY_TRUSTED_PROXIES:-127.0.0.1,::1,::ffff:127.0.0.1}"
      PROXY_WSS_ENABLED: "true"
      PROXY_WSS_PORT: "${PROXY_WSS_PORT:-19010}"
      PROXY_WSS_PATH: "/push"
      PROXY_WSS_AUTH_TRANSPORT: "sec-websocket-protocol"
      # CHANGE IT in .env before any internet-facing deployment. Mainnet must
      # never run with a default or shared token — a long random secret per host.
      PROXY_WSS_AUTH_TOKEN: "${PROXY_WSS_AUTH_TOKEN:-CHANGE-ME-mainnet-wss-token}"
      PROXY_HTTP_ENABLED: "true"
      PROXY_HTTP_ENVIRONMENT: "Neurai Mainnet"
      PROXY_HTTP_ENDPOINT: "${PROXY_HTTP_ENDPOINT:-https://rpc-main.neurai.org/rpc}"
      PROXY_HTTP_MAX_RPS_PER_IP: "${PROXY_HTTP_MAX_RPS_PER_IP:-20}"
      # Default deployment: behind a host reverse proxy that terminates TLS
      # (HestiaCP / nginx / Caddy / etc). The proxy listens on plain ws://
      # internally and the reverse proxy on the host adds TLS + LE renewal.
      #
      # In HestiaCP: add the (sub)domain, enable Let's Encrypt in the UI, and
      # drop this nginx snippet at
      #   /home/<user>/conf/web/<domain>/nginx.ssl.conf_wss
      # then run `v-restart-web`:
      #
      #   location /push {
      #       proxy_pass http://127.0.0.1:${PROXY_WSS_PORT}/push;   # 19010 by default
      #       proxy_http_version 1.1;
      #       proxy_set_header Upgrade $http_upgrade;
      #       proxy_set_header Connection "upgrade";
      #       proxy_set_header Host $host;
      #       proxy_set_header X-Forwarded-For $remote_addr;
      #       proxy_read_timeout 3600s;
      #   }
      #
      #   # Public HTTP RPC (`/rpc`, UI and metadata). Do not set
      #   # Upgrade/Connection here: these are ordinary HTTP requests.
      #   location / {
      #       proxy_pass http://127.0.0.1:${PROXY_WSS_PORT};
      #       proxy_set_header Host $host;
      #       proxy_set_header X-Forwarded-For $remote_addr;
      #       proxy_set_header X-Forwarded-Proto $scheme;
      #   }
      #
      # To run the proxy with its own TLS (self-signed dev cert or LE files
      # mounted from the host), set PROXY_WSS_TLS_ENABLED=true.
      # PROXY_WSS_AUTOGEN_CERT=true generates a self-signed cert for dev.
      PROXY_WSS_TLS_ENABLED: "false"
      PROXY_WSS_AUTOGEN_CERT: "false"
      PROXY_WSS_ZMQ_SEQUENCE_ENABLED: "false"
      # Optional local stats endpoint for ops/monitoring. When enabled, exposes
      # GET http://127.0.0.1:<port>/stats with sessions/subs/tip/zmq/queue.
      # Always loopback-only (unauthenticated); never publish the port.
      PROXY_WSS_STATS_ENABLED: "${PROXY_WSS_STATS_ENABLED:-false}"
      PROXY_WSS_STATS_PORT: "19021"
      PROXY_ZMQ_ENDPOINT: "tcp://neuraid:28332"

    ports:
      # WSS + HTTP bound to PROXY_BIND (loopback by default). Mainnet uses
      # 19010 so it can coexist with the testnet stack (19020) on one host; the
      # host reverse proxy (HestiaCP nginx) reaches it via 127.0.0.1:PROXY_WSS_PORT.
      # Never publish it to the internet while TLS_ENABLED=false — anyone could
      # forge X-Forwarded-For.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_WSS_PORT:-19010}:${PROXY_WSS_PORT:-19010}"

    networks:
      - neurai_net_mainnet

    depends_on:
      neuraid:
        condition: service_healthy

volumes:
  neurai_data_mainnet:
    driver: local

networks:
  neurai_net_mainnet:
    driver: bridge
