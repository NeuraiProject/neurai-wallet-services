# neurai.conf para el nodo MAINNET usando la imagen oficial
# neuraiproject/neurai-node.
#
# El script /node.sh de la imagen oficial SOLO genera su propio
# /data/node/neurai.conf cuando no existe, y NO configura ZMQ. Como el
# rpc-proxy necesita ZMQ (tcp://neuraid:28332) para el push en tiempo real,
# montamos este fichero en /data/node/neurai.conf (modo solo lectura) para que
# la imagen lo respete en lugar de generar el suyo.

# ── Network (mainnet: sin línea testnet=) ────────────────────────────────────
listen=0
rest=1
port=19000

# ── RPC ──────────────────────────────────────────────────────────────────────
server=1
rpcuser=neurai
rpcpassword=changeme
# rpcallowip: restringir en producción (p.ej. 127.0.0.1/32). 0.0.0.0/0 permite
# que el contenedor rpc-proxy alcance al nodo por la red interna del compose.
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcport=19001
rpcservertimeout=240
rpcworkqueue=64
rpcthreads=8

# ── Wallet (deshabilitada) ───────────────────────────────────────────────────
disablewallet=1

# ── Indexes ──────────────────────────────────────────────────────────────────
# Nota: pubkeyindex existe en la rama DePIN-Test pero NO en el release 1.0.5
# del que se compila la imagen oficial. neuraid aborta el arranque ante una
# opción desconocida, así que aquí se omite a propósito.
txindex=1
assetindex=1
addressindex=1
timestampindex=1
spentindex=1

# ── ZMQ — consumido por rpc-proxy en tcp://neuraid:28332 ─────────────────────
zmqpubhashblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubhashtx=tcp://0.0.0.0:28332

# ── Log — reducir debug.log automáticamente cuando crece demasiado ───────────
shrinkdebugfile=1

# ── Docker — ejecutar en primer plano (daemon=1 rompe el ciclo de vida) ──────
daemon=0
