name: neurai-wallet-services-testnet

# Deployment-specific values (secrets, ports, public URL, trusted proxies,
# quotas, token) come from a `.env` file next to this compose file — copy
# `.env.example` to `.env` and edit it there; it is ignored by git, so it
# survives updates to this file. Every `${VAR:-default}` below has the same
# default in .env.example, so the stack also starts without a .env.

services:
  neuraid:
    build:
      context: ../node
      dockerfile: Dockerfile
      args:
        BRANCH: "${NODE_BRANCH:-DePIN-Test}"
        # Reviewed C6 commit of NODE_BRANCH (same reset-testnet genesis).
        # Pinning it also forces Docker to rebuild instead of reusing a cached
        # clone of the branch from before the reset.
        SOURCE_COMMIT: "${NODE_SOURCE_COMMIT:-e64965d7311ff51d0f3a9a3a48d8e75992122b5c}"
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # ── Network ──────────────────────────────────────────────────────────
      NEURAI_TESTNET: "1"
      # NEURAI_LISTEN: 1 to accept inbound P2P connections
      NEURAI_LISTEN: "0"
      NEURAI_REST: "1"

      # ── RPC ──────────────────────────────────────────────────────────────
      # Same .env values feed the NEURAI_NODE_URL of wallet-services below.
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"
      # NEURAI_RPC_ALLOW_IP: restrict in production (e.g. 127.0.0.1/32)
      NEURAI_RPC_ALLOW_IP: "0.0.0.0/0"
      NEURAI_RPC_PORT: "${NODE_RPC_PORT:-19101}"
      NEURAI_RPC_TIMEOUT: "240"
      NEURAI_RPC_WORKQUEUE: "64"
      NEURAI_RPC_THREADS: "8"

      # ── Wallet ───────────────────────────────────────────────────────────
      # NEURAI_DISABLE_WALLET: 1=disabled | 0=enabled. DePIN needs it enabled:
      # the pool key is derived from a dedicated, unencrypted wallet that must
      # never hold funds (see NEURAI_DEPIN_WALLET).
      NEURAI_DISABLE_WALLET: "0"

      # ── DePIN messaging (protocol 2) ──────────────────────────────────────
      # Served on the RPC port (19101). No DePIN port, URL or gateway exists;
      # wallet-services relays the depin* RPCs through NEURAI_NODE_URL. The
      # entrypoint refuses to start without a token or with the wallet off.
      NEURAI_DEPIN_ENABLED: "1"
      NEURAI_DEPIN_TOKEN: "${NEURAI_DEPIN_TOKEN:-&DEPINTESTING}"
      # Per-address quota enforced by the node (challenges + submissions / min).
      NEURAI_DEPIN_RATE_LIMIT: "${NEURAI_DEPIN_RATE_LIMIT:-20}"
      NEURAI_DEPIN_MAX_MESSAGE_SIZE: "1024"
      NEURAI_DEPIN_MESSAGE_EXPIRY: "168"
      NEURAI_DEPIN_MAX_POOL_SIZE: "100"
      NEURAI_DEPIN_MAX_RECIPIENTS: "20"
      # Optional dedicated wallet file (empty = default wallet).
      NEURAI_DEPIN_WALLET: "${NEURAI_DEPIN_WALLET:-}"

      # ── Indexes ──────────────────────────────────────────────────────────
      NEURAI_TXINDEX: "1"
      NEURAI_ASSETINDEX: "1"
      NEURAI_ADDRESSINDEX: "1"
      NEURAI_TIMESTAMPINDEX: "1"
      NEURAI_SPENTINDEX: "1"
      NEURAI_PUBKEYINDEX: "1"

      # -- ZMQ ----------------------------------------------------------------
      # Internal Docker endpoint used by wallet-services as tcp://neuraid:28332
      NEURAI_ZMQ_ENABLED: "1"
      NEURAI_ZMQ_BIND: "tcp://0.0.0.0:28332"

      # ── Data ─────────────────────────────────────────────────────────────
      NEURAI_DATADIR: "/data"

    # The reset testnet node refuses a data directory from the previous
    # testnet ("Incorrect or no genesis block found"). Nothing in it needs to
    # be kept: remove the old volume once with `docker compose down -v`.
    volumes:
      - neurai_data_testnet:/data

    # Internal-only — the node is not reachable from the host. The
    # wallet-services container talks to neuraid:19101 (RPC) and neuraid:28332 (ZMQ) over the
    # neurai_net_testnet bridge. Use `docker compose exec neuraid neurai-cli ...`
    # for CLI access.
    networks:
      - neurai_net_testnet

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  wallet-services:
    build:
      # Build the local checkout and its committed lockfile.
      context: ../..
      dockerfile: docker/wallet-services/Dockerfile
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # Chain the service accepts. The reset testnet keeps the chain name,
      # ports and address prefixes of the previous one, so the genesis hash is
      # what rejects a node still on the old chain (hello and every method
      # fail until a matching node is healthy). hello and GET /settings
      # report it as genesis_hash.
      NEURAI_NETWORK: "testnet"
      NEURAI_EXPECTED_GENESIS: "0000008b384aeffecdab182575dc4e86c9f07f90318c65088532660ed9a8a021"
      NEURAI_NODE_NAME: "neuraid-testnet"
      NEURAI_NODE_URL: "http://neuraid:${NODE_RPC_PORT:-19101}"
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"
      # DePIN protocol 2 goes through NEURAI_NODE_URL like any other RPC. The
      # service only adds a per-IP quota for depin* (shared by HTTP and WSS):
      # requests per minute, and minutes an IP that went over stays blocked.
      PROXY_DEPIN_RATE_LIMIT: "${PROXY_DEPIN_RATE_LIMIT:-60}"
      PROXY_DEPIN_BAN_MINUTES: "${PROXY_DEPIN_BAN_MINUTES:-10}"
      # Reverse proxies whose X-Forwarded-For is believed (HTTP and WSS). When
      # using Hestia/nginx on the host, add this Compose network's bridge
      # gateway (inspect it with `docker network inspect neurai_net_testnet`).
      # The reverse proxy must OVERWRITE the header ($remote_addr), never
      # append to it ($proxy_add_x_forwarded_for).
      PROXY_TRUSTED_PROXIES: "${PROXY_TRUSTED_PROXIES:-127.0.0.1,::1,::ffff:127.0.0.1}"
      # false = the HTTP API alone, without the /push WebSocket: no auth token
      # or ZMQ needed, same port and bind (see .env).
      PROXY_WSS_ENABLED: "${PROXY_WSS_ENABLED:-true}"
      PROXY_WSS_PORT: "${PROXY_WSS_PORT:-19020}"
      PROXY_WSS_PATH: "/push"
      PROXY_WSS_AUTH_TRANSPORT: "sec-websocket-protocol"
      # Testnet-only default. Replace it in .env for any deployment reachable from the internet.
      PROXY_WSS_AUTH_TOKEN: "${PROXY_WSS_AUTH_TOKEN:-testnet-wss-token-do-not-use-in-production}"
      PROXY_HTTP_ENABLED: "true"
      PROXY_HTTP_ENVIRONMENT: "Neurai Testnet"
      PROXY_HTTP_ENDPOINT: "${PROXY_HTTP_ENDPOINT:-https://rpc-test.neurai.org/rpc}"
      PROXY_HTTP_MAX_RPS_PER_IP: "${PROXY_HTTP_MAX_RPS_PER_IP:-20}"
      # Opt-in read-only methods for every client, and trusted clients (own
      # budget, priority, extra methods; JSON array). Both come from .env.
      PROXY_HTTP_EXTRA_METHODS: "${PROXY_HTTP_EXTRA_METHODS:-}"
      PROXY_HTTP_CLIENTS: "${PROXY_HTTP_CLIENTS:-[]}"
      # Time limit for calls to the node (ms) and per-method overrides (JSON).
      PROXY_RPC_TIMEOUT_MS: "${PROXY_RPC_TIMEOUT_MS:-30000}"
      PROXY_RPC_METHOD_TIMEOUTS_MS: "${PROXY_RPC_METHOD_TIMEOUTS_MS:-}"
      # Default deployment: behind a host reverse proxy that terminates TLS
      # (HestiaCP / nginx / Caddy / etc). The service listens on plain ws://
      # internally and the reverse proxy on the host adds TLS + LE renewal.
      #
      # In HestiaCP: add the (sub)domain, enable Let's Encrypt in the UI, and
      # drop this nginx snippet at
      #   /home/<user>/conf/web/<domain>/nginx.ssl.conf_wss
      # then run `v-restart-web`:
      #
      #   location /push {
      #       proxy_pass http://127.0.0.1:${PROXY_WSS_PORT}/push;   # 19020 by default
      #       proxy_http_version 1.1;
      #       proxy_set_header Upgrade $http_upgrade;
      #       proxy_set_header Connection "upgrade";
      #       proxy_set_header Host $host;
      #       proxy_set_header X-Forwarded-For $remote_addr;
      #       proxy_read_timeout 3600s;
      #   }
      #
      #   # Public HTTP RPC (`/rpc`, UI and metadata). Do not set
      #   # Upgrade/Connection here: these are ordinary HTTP requests.
      #   location / {
      #       proxy_pass http://127.0.0.1:${PROXY_WSS_PORT};
      #       proxy_set_header Host $host;
      #       proxy_set_header X-Forwarded-For $remote_addr;
      #       proxy_set_header X-Forwarded-Proto $scheme;
      #   }
      #
      # To run the service with its own TLS (self-signed dev cert or LE files
      # mounted from the host), set PROXY_WSS_TLS_ENABLED=true.
      # PROXY_WSS_AUTOGEN_CERT=true generates a self-signed cert for dev.
      PROXY_WSS_TLS_ENABLED: "false"
      PROXY_WSS_AUTOGEN_CERT: "false"
      PROXY_WSS_ZMQ_SEQUENCE_ENABLED: "false"
      # From height 10 the reset testnet runs 30 s blocks and accepts reorgs
      # up to 120 blocks deep (NIP-028), twice mainnet's 60. chain.reorg
      # reports this depth and the in-memory block index keeps twice as many
      # hashes.
      PROXY_WSS_REORG_INVALIDATE_DEPTH: "120"
      # Optional local stats endpoint for ops/monitoring. When enabled, exposes
      # GET http://127.0.0.1:<port>/stats with sessions/subs/tip/zmq/queue.
      # Always loopback-only (unauthenticated); never publish the port.
      PROXY_WSS_STATS_ENABLED: "${PROXY_WSS_STATS_ENABLED:-false}"
      PROXY_WSS_STATS_PORT: "19021"
      PROXY_ZMQ_ENDPOINT: "tcp://neuraid:28332"

    ports:
      # WSS + HTTP bound to PROXY_BIND (loopback by default). The host reverse
      # proxy (HestiaCP nginx) reaches it via 127.0.0.1:PROXY_WSS_PORT. Never
      # publish it to the internet while TLS_ENABLED=false — anyone could forge
      # X-Forwarded-For.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_WSS_PORT:-19020}:${PROXY_WSS_PORT:-19020}"

    networks:
      - neurai_net_testnet

    depends_on:
      neuraid:
        condition: service_healthy

volumes:
  neurai_data_testnet:
    driver: local

networks:
  neurai_net_testnet:
    driver: bridge
