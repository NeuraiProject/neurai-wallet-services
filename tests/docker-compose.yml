services:
  wss-test:
    # Acceptance test client. This compose file is intended to be layered after
    # docker/testnet/docker-compose.yml so it can reuse the service network.
    build:
      context: ../tests/wss-test
      dockerfile: Dockerfile
    profiles:
      - test
    environment:
      # Port and token follow docker/testnet/.env (same defaults as there).
      PROXY_HOST: rpc-proxy
      PROXY_PORT: "${PROXY_WSS_PORT:-19020}"
      PROXY_PATH: /push
      # Match the rpc-proxy TLS setting above: "ws" when TLS_ENABLED=false, "wss" when true.
      PROXY_SCHEME: "ws"
      PROXY_TOKEN: "${PROXY_WSS_AUTH_TOKEN:-testnet-wss-token-do-not-use-in-production}"
      # hello must report this genesis: the suite fails if the stack is still
      # serving the testnet from before the reset. Empty = skip the check.
      EXPECTED_GENESIS: "${TEST_EXPECTED_GENESIS-0000008b384aeffecdab182575dc4e86c9f07f90318c65088532660ed9a8a021}"
      # Optional funded addresses on the reset testnet (set them in .env).
      # Valid formats: t… (legacy), tnc1p… (AuthScript v1), tpq1z… (PQ v2),
      # tnq1r… (ECDSA v3). Empty values skip the happy-path address and asset
      # tests.
      TEST_ADDRESS: "${TEST_ADDRESS:-}"
      TEST_ASSET_ADDRESS: "${TEST_ASSET_ADDRESS:-}"
      TEST_ASSET_NAME: "${TEST_ASSET_NAME:-}"
      BURST_SIZE: "80"
      BURST_LIMIT: "50"
    depends_on:
      - rpc-proxy
    networks:
      - neurai_net_testnet
